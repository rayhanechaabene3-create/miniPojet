{% extends 'miniProjet/base.html' %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-8 mx-auto">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="mb-4 text-danger">Modifier le profil Hôpital</h3>

                <form method="post">
                    {% csrf_token %}
                    <h5 class="mb-3 text-secondary">Informations du compte (Admin)</h5>
                    {{ user_form.as_p }}
                    
                    <button type="submit" class="btn btn-primary mt-3 px-4">Enregistrer les dmodifications</button>
                    <a href="{% url 'dashboard_hopital' %}" class="btn btn-outline-secondary mt-3 ms-2">Annuler</a>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
