{% extends 'miniProjet/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card mt-5">
            <div class="card-body p-4">
                <h3 class="text-center mb-4 text-danger">Connexion</h3>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Nom d'utilisateur</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mot de passe</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Se connecter</button>
                </form>
                <div class="text-center mt-4">
                    <p class="mb-1">Pas encore de compte ?</p>
                    <a href="{% url 'inscription' %}" class="btn btn-outline-danger btn-sm m-1">Devenir Donneur</a>
                    <a href="{% url 'hopital_inscription' %}" class="btn btn-outline-secondary btn-sm m-1">Inscrire un Hôpital</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
