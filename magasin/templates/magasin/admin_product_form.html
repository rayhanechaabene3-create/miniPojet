{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ action }} un produit — Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); min-height: 100vh; }
        .admin-navbar { background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0,0,0,0.06); padding: 0 2rem; height: 68px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .brand { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 700; color: #000; text-decoration: none; }
        .brand span { color: #c9a265; }
        .card { border: none; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        
        /* Dark mode */
        body.dark { background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 100%); color: #e0e0e0; }
        body.dark .admin-navbar { background: rgba(20,20,30,0.85); border-color: rgba(255,255,255,0.08); }
        body.dark .brand { color: #fff; }
        body.dark .card { background: rgba(30,30,40,0.8); border: 1px solid rgba(255,255,255,0.08); }
        body.dark .form-control, body.dark .form-select { background-color: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); color: #fff; }
        body.dark .form-control:focus, body.dark .form-select:focus { background-color: rgba(255,255,255,0.1); color: #fff; border-color: #c9a265; box-shadow: none; }
        body.dark .btn-light { background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.2); }
        body.dark .btn-dark { background: #c9a265; border-color: #c9a265; color: #fff; }
    </style>
</head>
<body>
<nav class="admin-navbar">
    <a href="{% url 'admin_dashboard' %}" class="brand">Magasin<span>.</span> <small class="fs-6 text-muted fw-400">Admin</small></a>
    <a href="{% url 'deconnexion_magasin' %}" class="btn btn-danger rounded-pill px-4">
        <i class="bi bi-box-arrow-left me-2"></i>Déconnexion
    </a>
</nav>

<div class="container py-4" style="max-width:720px;">
    <div class="d-flex align-items-center gap-3 mb-4">
        <a href="{% url 'admin_dashboard' %}" class="btn btn-light rounded-pill border"><i class="bi bi-arrow-left"></i></a>
        <h4 class="mb-0" style="font-family:'Playfair Display',serif;">{{ action }} un produit</h4>
    </div>
    <div class="card p-4">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label fw-500">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors.as_text }}</div>{% endif %}
            </div>
            {% endfor %}
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-dark rounded-pill px-4"><i class="bi bi-check-lg me-1"></i>{{ action }}</button>
                <a href="{% url 'admin_dashboard' %}" class="btn btn-light border rounded-pill px-4">Annuler</a>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function() {
        if (localStorage.getItem('magasin_dark') === '1') {
            document.body.classList.add('dark');
        }
    })();
</script>
</body>
</html>
