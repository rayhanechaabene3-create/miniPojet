{% extends 'magasin/base.html' %}

{% block title %}{{ action }} une catégorie{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-3 mb-4">
    <a href="{% url 'admin_dashboard' %}" class="btn btn-light rounded-pill border">
        <i class="bi bi-arrow-left"></i>
    </a>
    <h3 class="fw-700 mb-0" style="font-family:'Playfair Display',serif;">{{ action }} une catégorie</h3>
</div>

<div class="card border-0 shadow-sm p-4" style="border-radius:20px; max-width:480px;">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label class="form-label fw-500">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <div class="text-danger small mt-1">{{ field.errors.as_text }}</div>
            {% endif %}
        </div>
        {% endfor %}
        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-dark rounded-pill px-4">
                <i class="bi bi-check-lg me-1"></i>{{ action }}
            </button>
            <a href="{% url 'admin_dashboard' %}" class="btn btn-light border rounded-pill px-4">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
