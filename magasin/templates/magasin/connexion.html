{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Magasin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { border: none; border-radius: 24px; box-shadow: 0 8px 32px rgba(31,38,135,0.08); background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); padding: 2.5rem; width: 100%; max-width: 420px; }
        .brand { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; color: #000; }
        .brand span { color: #c9a265; }
        .btn-primary { background: #000; border-color: #000; border-radius: 50px; padding: 0.7rem; font-weight: 600; }
        .btn-primary:hover { background: #c9a265; border-color: #c9a265; }
        .form-control { border-radius: 12px; padding: 0.7rem 1rem; }
        .form-control:focus { box-shadow: 0 0 0 3px rgba(201,162,101,0.2); border-color: #c9a265; }
        ul.errorlist { list-style: none; padding: 0; color: #dc3545; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="text-center mb-4">
            <a href="/" class="brand text-decoration-none">Magasin<span>.</span></a>
            <p class="text-muted mt-1">Connectez-vous pour accéder au magasin</p>
        </div>
        {% if form.non_field_errors %}
            <div class="alert alert-danger py-2">{{ form.non_field_errors }}</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label fw-500">{{ field.label }}</label>
                {{ field }}
                {{ field.errors }}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary w-100 mt-2">Se connecter</button>
        </form>
        <p class="text-center text-muted mt-3 mb-0">
            Pas encore de compte ? <a href="{% url 'inscription_magasin' %}" style="color:#c9a265;">S'inscrire</a>
        </p>
    </div>
    <script>
        document.querySelectorAll('input').forEach(el => el.classList.add('form-control'));
    </script>
</body>
</html>
